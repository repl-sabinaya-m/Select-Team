<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TeamForge — Build Your Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<!-- Fallback if Clash Display not available via Google -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Root ─────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:       #f5f0e8;
  --surface:  #ffffff;
  --ink:      #1a1208;
  --ink2:     #4a3f2f;
  --muted:    #9e8e76;
  --border:   #e0d6c4;
  --border2:  #ccc0a8;
  --accent:   #e8400c;
  --accent2:  #f7c200;
  --r:        16px;
  --shadow:   0 2px 0 #1a1208;
  --shadow-lg:0 4px 0 #1a1208;
}

html, body { min-height:100vh; background:var(--bg); }

body {
  font-family: 'Cabinet Grotesk', 'Trebuchet MS', sans-serif;
  color: var(--ink);
  overflow-x: hidden;
}

/* ── Dot-grid background ─────────────────────────────────────── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0;
  background-image: radial-gradient(circle, #c8b89a 1px, transparent 1px);
  background-size: 28px 28px;
  opacity:0.45;
  pointer-events:none;
}

/* ── Layout ──────────────────────────────────────────────────── */
#app {
  position:relative; z-index:1;
  max-width:860px; margin:0 auto;
  padding:32px 20px 80px;
}

/* ── Typography ──────────────────────────────────────────────── */
.display {
  font-family: 'Clash Display', 'Cabinet Grotesk', sans-serif;
  font-weight:700;
  letter-spacing:-1.5px;
}

/* ── Header ──────────────────────────────────────────────────── */
.site-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:40px;
}
.logo {
  font-family:'Clash Display','Cabinet Grotesk',sans-serif;
  font-weight:700; font-size:1.6rem; letter-spacing:-1px;
  color:var(--ink);
}
.logo span {
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:2px 10px 3px;
  border-radius:6px;
  margin-left:2px;
}
.step-pills {
  display:flex; gap:8px;
}
.step-pill {
  padding:6px 14px;
  border-radius:20px;
  border:2px solid var(--border2);
  background:var(--surface);
  font-size:0.78rem; font-weight:700;
  color:var(--muted);
  box-shadow:var(--shadow);
  transition:all 0.2s;
}
.step-pill.active {
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}
.step-pill.done {
  background:var(--accent2);
  border-color:var(--ink);
  color:var(--ink);
}

/* ── Section heading ─────────────────────────────────────────── */
.section-title {
  font-size:clamp(1.8rem,5vw,2.8rem);
  font-family:'Clash Display','Cabinet Grotesk',sans-serif;
  font-weight:700; letter-spacing:-1px;
  line-height:1.1; margin-bottom:8px;
}
.section-sub {
  color:var(--ink2); font-size:0.95rem; font-weight:500;
  margin-bottom:28px;
}

/* ── Cards ───────────────────────────────────────────────────── */
.card {
  background:var(--surface);
  border:2px solid var(--ink);
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  padding:28px;
  margin-bottom:20px;
}

/* ── Input ───────────────────────────────────────────────────── */
.input-row {
  display:flex; gap:10px; align-items:center;
}
.inp {
  flex:1;
  padding:13px 16px;
  border:2px solid var(--border2);
  border-radius:12px;
  background:var(--bg);
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:1rem; font-weight:500; color:var(--ink);
  outline:none; transition:border-color 0.15s, box-shadow 0.15s;
}
.inp:focus {
  border-color:var(--ink);
  box-shadow:0 0 0 3px rgba(26,18,8,0.1);
}
.inp::placeholder { color:var(--muted); font-weight:400; }
.inp.error { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,64,12,0.12); }

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  padding:12px 22px;
  border-radius:12px;
  border:2px solid var(--ink);
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:0.95rem; font-weight:700;
  cursor:pointer; transition:all 0.12s;
  display:inline-flex; align-items:center; gap:7px;
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.btn:active { transform:translateY(1px); box-shadow:none; }

.btn-primary { background:var(--ink); color:#fff; }
.btn-accent  { background:var(--accent); color:#fff; border-color:var(--ink); }
.btn-yellow  { background:var(--accent2); color:var(--ink); border-color:var(--ink); }
.btn-ghost   { background:var(--bg); color:var(--ink); }
.btn-sm      { padding:8px 14px; font-size:0.82rem; border-radius:9px; }
.btn-icon    { padding:10px 12px; }
.btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:var(--shadow); }

/* ── Team count selector ─────────────────────────────────────── */
.count-grid {
  display:flex; gap:10px; flex-wrap:wrap;
  margin-top:14px;
}
.count-btn {
  width:52px; height:52px;
  border-radius:12px;
  border:2px solid var(--border2);
  background:var(--bg);
  font-family:'Clash Display','Cabinet Grotesk',sans-serif;
  font-size:1.2rem; font-weight:700; color:var(--muted);
  cursor:pointer; transition:all 0.15s;
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.count-btn:hover { border-color:var(--ink); color:var(--ink); transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.count-btn.active {
  background:var(--ink); border-color:var(--ink); color:#fff;
  transform:translateY(-2px); box-shadow:var(--shadow-lg);
}

/* ── Members pool ────────────────────────────────────────────── */
.members-pool {
  display:flex; flex-wrap:wrap; gap:8px;
  min-height:56px;
  padding:10px;
  border:2px dashed var(--border2);
  border-radius:14px;
  background:var(--bg);
  margin-top:12px;
  transition:border-color 0.2s;
}
.members-pool:empty::after {
  content:'No members added yet…';
  color:var(--muted); font-size:0.85rem; font-weight:500;
  align-self:center;
}
.member-chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px 6px 8px;
  border-radius:20px;
  border:2px solid var(--ink);
  background:var(--surface);
  font-size:0.85rem; font-weight:700;
  box-shadow:2px 2px 0 var(--ink);
  animation: chipIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
  cursor:default;
  user-select:none;
}
@keyframes chipIn {
  from { transform:scale(0.5); opacity:0; }
  to   { transform:scale(1);   opacity:1; }
}
.chip-avatar {
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; font-weight:800; color:#fff;
  flex-shrink:0;
}
.chip-remove {
  margin-left:2px;
  width:16px; height:16px; border-radius:50%;
  background:rgba(0,0,0,0.12);
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; color:var(--ink);
  transition:background 0.15s;
  padding:0;
}
.chip-remove:hover { background:var(--accent); color:#fff; }

/* ── Error / success msgs ────────────────────────────────────── */
.msg {
  display:flex; align-items:center; gap:8px;
  padding:10px 14px;
  border-radius:10px;
  font-size:0.85rem; font-weight:600;
  margin-top:10px;
  animation:fadeSlide 0.2s ease;
  border:1.5px solid;
}
@keyframes fadeSlide { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
.msg-error   { background:#fff0ec; border-color:#f5b4a2; color:#c23000; }
.msg-success { background:#f0fdf4; border-color:#86efac; color:#166534; }
.msg-info    { background:#fffbeb; border-color:#fde68a; color:#92400e; }

/* ── Teams grid ──────────────────────────────────────────────── */
.teams-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
  gap:16px;
  margin-top:8px;
}

.team-card {
  border:2px solid var(--ink);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  background:var(--surface);
  transition:transform 0.15s, box-shadow 0.15s;
}
.team-card:hover { transform:translateY(-3px); box-shadow:0 6px 0 var(--ink); }

.team-header {
  padding:14px 16px 12px;
  border-bottom:2px solid var(--ink);
  display:flex; align-items:center; gap:10px;
}
.team-color-dot {
  width:14px; height:14px; border-radius:50%;
  border:2px solid var(--ink); flex-shrink:0;
}
.team-name {
  font-family:'Clash Display','Cabinet Grotesk',sans-serif;
  font-size:1rem; font-weight:700; flex:1; letter-spacing:-0.3px;
}
.team-count-badge {
  font-size:0.72rem; font-weight:800;
  padding:3px 8px; border-radius:6px;
  border:1.5px solid var(--ink);
  background:var(--bg);
  font-family:'Cabinet Grotesk',sans-serif;
}

.team-body { padding:14px 16px; min-height:60px; }
.team-body .member-chip { margin:3px; }

.team-drop-zone {
  min-height:54px;
  border:2px dashed var(--border2);
  border-radius:10px;
  padding:8px;
  display:flex; flex-wrap:wrap; gap:6px;
  transition:border-color 0.15s, background 0.15s;
}
.team-drop-zone.has-members {
  border-style:solid; border-color:var(--border);
}
.team-drop-zone:empty::after {
  content:'Drop members here';
  color:var(--muted); font-size:0.78rem; font-weight:500;
  align-self:center; margin:auto;
}

/* ── Assign panel ────────────────────────────────────────────── */
.assign-section { margin-top:6px; }
.assign-label {
  font-size:0.7rem; font-weight:800;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); margin-bottom:8px;
}

/* Unassigned chip pool */
.unassigned-pool {
  display:flex; flex-wrap:wrap; gap:7px;
  min-height:48px;
  padding:10px 12px;
  background:var(--bg);
  border:2px solid var(--border2);
  border-radius:12px;
  margin-bottom:16px;
}
.unassigned-pool:empty::after {
  content:'All members assigned ✓';
  color:#22c55e; font-size:0.82rem; font-weight:700;
  align-self:center;
}

.assignable-chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 10px 5px 7px;
  border-radius:20px;
  border:2px solid var(--ink);
  background:var(--surface);
  font-size:0.82rem; font-weight:700;
  box-shadow:2px 2px 0 var(--ink);
  cursor:pointer;
  transition:all 0.12s;
  user-select:none;
}
.assignable-chip:hover {
  background:var(--accent2);
  transform:translateY(-2px);
  box-shadow:2px 4px 0 var(--ink);
}
.assignable-chip.selected {
  background:var(--ink); color:#fff;
  transform:translateY(-2px); box-shadow:2px 4px 0 var(--accent);
}

/* ── Team target buttons ─────────────────────────────────────── */
.team-targets {
  display:flex; flex-wrap:wrap; gap:8px;
  margin-top:8px;
}
.team-target-btn {
  display:flex; align-items:center; gap:7px;
  padding:9px 16px;
  border-radius:12px;
  border:2px solid var(--ink);
  background:var(--surface);
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:0.85rem; font-weight:700;
  cursor:pointer; transition:all 0.12s;
  box-shadow:var(--shadow);
}
.team-target-btn:hover {
  transform:translateY(-2px); box-shadow:var(--shadow-lg);
  background:var(--bg);
}
.team-target-btn .dot {
  width:10px; height:10px; border-radius:50%; border:1.5px solid var(--ink); flex-shrink:0;
}

/* ── Summary table ───────────────────────────────────────────── */
.summary-table { width:100%; border-collapse:collapse; }
.summary-table th {
  text-align:left; padding:10px 14px;
  font-size:0.72rem; font-weight:800;
  text-transform:uppercase; letter-spacing:1.5px;
  background:var(--ink); color:#fff;
  border-bottom:2px solid var(--ink);
}
.summary-table th:first-child { border-radius:10px 0 0 0; }
.summary-table th:last-child  { border-radius:0 10px 0 0; }
.summary-table td {
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  font-size:0.9rem; font-weight:500;
  vertical-align:middle;
}
.summary-table tr:last-child td { border-bottom:none; }
.summary-table tr:nth-child(even) td { background:rgba(0,0,0,0.025); }
.member-chips-inline { display:flex; flex-wrap:wrap; gap:5px; }

/* ── Progress bar ─────────────────────────────────────────────  */
.progress-bar-wrap {
  height:8px; background:var(--border);
  border-radius:4px; overflow:hidden;
  border:1.5px solid var(--border2); margin-top:6px;
}
.progress-bar-fill {
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--accent2), var(--accent));
  transition:width 0.4s cubic-bezier(0.4,0,0.2,1);
}

/* ── Toast ───────────────────────────────────────────────────── */
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:#fff;
  padding:12px 22px; border-radius:12px;
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:0.9rem; font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  z-index:999; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap;
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* ── Divider ─────────────────────────────────────────────────── */
.divider {
  border:none; border-top:2px dashed var(--border2);
  margin:24px 0;
}

/* ── Animations ─────────────────────────────────────────────── */
.screen { animation: screenIn 0.3s ease both; }
@keyframes screenIn {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:none; }
}

.team-card { animation: cardIn 0.3s cubic-bezier(0.34,1.4,0.64,1) both; }

/* ── Responsive ──────────────────────────────────────────────── */
@media(max-width:560px){
  .teams-grid { grid-template-columns:1fr; }
  .site-header { flex-direction:column; align-items:flex-start; gap:12px; }
  .input-row { flex-direction:column; }
  .inp { width:100%; }
}


/* ── DRAW / SPIN ───────────────────────────────────────────────── */
@keyframes drawSpin {
  to { transform: rotate(360deg); }
}
@keyframes bounce {
  0%,100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-8px) scale(1.1); }
}
@keyframes slotSpin {
  0%   { transform: translateY(-10px); opacity: 0; }
  60%  { transform: translateY(3px);   opacity: 1; }
  100% { transform: translateY(0);     opacity: 1; }
}
@keyframes resultPop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
@keyframes cardIn {
  from { transform: translateX(-16px); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS & HELPERS
// ═══════════════════════════════════════════════════════════════
const TEAM_COLORS = [
  "#e8400c","#f7c200","#22c55e","#3b82f6",
  "#a855f7","#ec4899","#14b8a6","#f97316",
  "#6366f1","#84cc16"
];
const TEAM_NAMES = [
  "Phoenix","Falcon","Titan","Cobra",
  "Storm","Blaze","Nova","Viper",
  "Eagle","Rocket"
];

let state = {
  step: 1,            // 1=setup, 2=assign, 3=summary, 4=toss
  numTeams: null,
  members: [],        // all added names (lowercase-normalised for dedup)
  memberInput: "",
  teams: [],          // [{id,name,color,members:[]}]
  selectedChip: null, // name currently selected to assign
  editingTeamName: null,
  // Draw state
  drawPhase: "ready",      // "ready"|"spinning"|"result"
  drawWinner: null,        // team id that won the draw
  drawOrder: [],           // full ranked order [{id,rank}]
  drawAnim: false,
};

function genId(){ return Math.random().toString(36).slice(2,8); }

function normalize(name){ return name.trim().toLowerCase(); }

function avatarColor(name){
  const h = [...name].reduce((a,c)=>a+c.charCodeAt(0),0);
  return TEAM_COLORS[h % TEAM_COLORS.length];
}

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function toast(msg, dur=2500){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
}

function setState(partial){
  Object.assign(state, partial);
  render();
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render(){
  document.getElementById("app").innerHTML = buildApp();
  attachEvents();
}

function buildApp(){
  const steps = [
    {n:1, label:"Members"},
    {n:2, label:"Assign"},
    {n:3, label:"Summary"},
    {n:4, label:"Draw 🎰"},
  ];
  const pillsHtml = steps.map(s=>`
    <div class="step-pill ${state.step===s.n?"active":state.step>s.n?"done":""}">
      ${state.step>s.n?"✓ ":""}${s.n}. ${s.label}
    </div>`).join("");

  let screenHtml = "";
  if(state.step===1) screenHtml = buildStep1();
  if(state.step===2) screenHtml = buildStep2();
  if(state.step===3) screenHtml = buildStep3();
  if(state.step===4) screenHtml = buildStep4();

  return `
    <header class="site-header">
      <div class="logo">Team<span>Forge</span></div>
      <div class="step-pills">${pillsHtml}</div>
    </header>
    <div class="screen">${screenHtml}</div>
  `;
}

// ──────────────────────────────────────────────────────────────
// STEP 1 — Members & Team Count
// ──────────────────────────────────────────────────────────────
function buildStep1(){
  // Member chips
  const chips = state.members.map(m=>`
    <div class="member-chip" style="border-color:${avatarColor(m)}">
      <div class="chip-avatar" style="background:${avatarColor(m)}">${initials(m)}</div>
      <span>${m}</span>
      <button class="chip-remove" data-action="remove-member" data-name="${m}" title="Remove">✕</button>
    </div>`).join("");

  // Team count buttons 2–10
  const countBtns = [2,3,4,5,6,7,8,9,10].map(n=>`
    <button class="count-btn ${state.numTeams===n?"active":""}" data-action="set-teams" data-n="${n}">${n}</button>
  `).join("");

  // Progress
  const assigned = state.teams.reduce((s,t)=>s+t.members.length,0);
  const total    = state.members.length;
  const canProceed = state.numTeams && state.members.length >= state.numTeams;

  // Validation msg
  let validMsg = "";
  if(state.numTeams && state.members.length > 0 && state.members.length < state.numTeams){
    validMsg = `<div class="msg msg-info">⚠️ You have ${state.members.length} member${state.members.length>1?"s":""} but selected ${state.numTeams} teams. Add at least ${state.numTeams - state.members.length} more member${state.numTeams-state.members.length>1?"s":""}.</div>`;
  }

  return `
    <div class="section-title">Build Your<br/>Dream Teams 🏆</div>
    <div class="section-sub">Add members, choose how many teams — we'll sort the rest.</div>

    <!-- Add Members -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div>
          <div style="font-size:1.05rem;font-weight:800;font-family:'Clash Display',sans-serif">
            👥 Team Members
          </div>
          <div style="font-size:0.8rem;color:var(--muted);margin-top:2px">
            ${state.members.length} member${state.members.length!==1?"s":""} added
          </div>
        </div>
        ${state.members.length>0?`<button class="btn btn-ghost btn-sm" data-action="clear-all">Clear all</button>`:""}
      </div>

      <div class="input-row">
        <input class="inp" id="member-input" type="text" placeholder="Enter member name…"
          value="${escHtml(state.memberInput)}" maxlength="40" autocomplete="off"/>
        <button class="btn btn-primary" data-action="add-member">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>

      <div class="members-pool" id="members-pool">${chips}</div>
    </div>

    <!-- Team Count -->
    <div class="card">
      <div style="font-size:1.05rem;font-weight:800;font-family:'Clash Display',sans-serif;margin-bottom:4px">
        🎯 How many teams?
      </div>
      <div style="font-size:0.82rem;color:var(--muted);margin-bottom:2px">Tap a number to select</div>
      <div class="count-grid">${countBtns}</div>
      ${validMsg}
    </div>

    <!-- Proceed -->
    <div style="display:flex;justify-content:flex-end;gap:10px;align-items:center">
      ${state.members.length>0&&state.numTeams?`
        <span style="font-size:0.82rem;color:var(--muted);font-weight:600">
          ${state.members.length} member${state.members.length!==1?"s":""} → ${state.numTeams} team${state.numTeams!==1?"s":""}
        </span>`:""}
      <button class="btn btn-accent" data-action="go-assign" ${canProceed?"":"disabled"}>
        Create Teams →
      </button>
    </div>
  `;
}

// ──────────────────────────────────────────────────────────────
// STEP 2 — Assign Members to Teams
// ──────────────────────────────────────────────────────────────
function buildStep2(){
  const unassignedNames = state.members.filter(m=>
    !state.teams.some(t=>t.members.includes(m))
  );
  const totalAssigned = state.members.length - unassignedNames.length;
  const pct = state.members.length ? Math.round(totalAssigned/state.members.length*100) : 0;
  const allAssigned = unassignedNames.length === 0;

  // Unassigned chips
  const unassignedChips = unassignedNames.map(m=>`
    <div class="assignable-chip ${state.selectedChip===m?"selected":""}"
      data-action="select-chip" data-name="${m}">
      <div class="chip-avatar" style="background:${avatarColor(m)};width:18px;height:18px;font-size:0.6rem">${initials(m)}</div>
      ${m}
    </div>`).join("");

  // Team cards
  const teamCards = state.teams.map((t,i)=>{
    const memberChips = t.members.map(m=>`
      <div class="member-chip" style="border-color:${t.color};font-size:0.78rem;padding:4px 9px 4px 6px">
        <div class="chip-avatar" style="background:${t.color};width:17px;height:17px;font-size:0.58rem">${initials(m)}</div>
        <span>${m}</span>
        <button class="chip-remove" data-action="unassign" data-member="${m}" data-team="${t.id}" title="Remove from team">✕</button>
      </div>`).join("");

    return `
      <div class="team-card" style="animation-delay:${i*0.05}s">
        <div class="team-header" style="background:${t.color}18">
          <div class="team-color-dot" style="background:${t.color}"></div>
          <div class="team-name">${escHtml(t.name)}</div>
          <div class="team-count-badge">${t.members.length}</div>
        </div>
        <div class="team-body">
          <div class="team-drop-zone ${t.members.length?"has-members":""}">
            ${memberChips}
          </div>
          ${state.selectedChip ? `
            <button class="btn btn-sm btn-yellow" style="margin-top:8px;width:100%"
              data-action="assign-to" data-team="${t.id}">
              + Add "${state.selectedChip}" here
            </button>` : ""}
        </div>
      </div>`;
  }).join("");

  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <button class="btn btn-ghost btn-sm" data-action="back-to-step1">← Back</button>
      <div class="section-title" style="font-size:clamp(1.4rem,4vw,2rem);margin-bottom:0">Assign Members 🎲</div>
    </div>
    <div class="section-sub">Tap a member → tap a team to add them. Or use Auto-assign!</div>

    <!-- Progress -->
    <div class="card" style="padding:16px 20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:0.82rem;font-weight:700">Assignment progress</span>
        <span style="font-size:0.82rem;font-weight:800;color:${allAssigned?"#166534":"var(--ink2)"}">
          ${totalAssigned}/${state.members.length} assigned ${allAssigned?"✓":""}
        </span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>

    <!-- Unassigned -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:1rem;font-weight:800;font-family:'Clash Display',sans-serif">
            Unassigned Members
          </div>
          <div style="font-size:0.78rem;color:var(--muted);margin-top:1px">
            ${unassignedNames.length>0
              ? `Tap a member to select, then tap a team below`
              : "Everyone has been assigned!"}
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-yellow btn-sm" data-action="auto-assign" ${unassignedNames.length===0?"disabled":""}>
            ⚡ Auto-assign

          <button class="btn btn-ghost btn-sm" data-action="reset-assign">Reset</button>
        </div>
      </div>
      <div class="unassigned-pool">${unassignedChips}</div>

      ${state.selectedChip ? `
        <div class="msg msg-info" style="margin-top:10px">

        </div>` : ""}
    </div>

    <!-- Teams grid -->
    <div class="teams-grid">${teamCards}</div>

// ──────────────────────────────────────────────────────────────
// STEP 4 — Fair Draw (Spinner Wheel)
// ──────────────────────────────────────────────────────────────
// Uses a CSS animated spinner + a timed reveal per team so
// no team can claim the result was unfair — every team's
// position is determined simultaneously by the same random draw.
// ──────────────────────────────────────────────────────────────
function buildStep4(){
  const { teams, drawPhase, drawWinner, drawOrder } = state;

  // ── Phase: ready ─────────────────────────────────────────────
  if(drawPhase === "ready"){
    const teamPreviews = teams.map((t,i) => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
        background:var(--bg);border:2px solid var(--border2);border-radius:12px">
        <div style="width:32px;height:32px;border-radius:10px;background:${t.color};
          border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
          color:#fff;font-weight:800;font-size:0.75rem;flex-shrink:0">
          ${t.name.slice(0,2).toUpperCase()}
        </div>
        <div>
          <div style="font-weight:700;font-size:0.9rem">${escHtml(t.name)}</div>
          <div style="font-size:0.72rem;color:var(--muted)">${t.members.length} member${t.members.length!==1?"s":""}</div>
        </div>
      </div>`).join("");

    return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <button class="btn btn-ghost btn-sm" data-action="back-to-step3">← Back</button>
        <div style="font-family:'Clash Display',sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);
          font-weight:700;letter-spacing:-1px">Who Goes First? 🎰</div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="font-size:1rem;font-weight:800;font-family:'Clash Display',sans-serif;margin-bottom:4px">
          Fair Random Draw
        </div>
        <div style="font-size:0.85rem;color:var(--ink2);font-weight:500;line-height:1.6;margin-bottom:18px">
          All <strong>${teams.length} teams</strong> will be ranked simultaneously by a single random draw.
          No team chooses — the wheel decides everything. Transparent, instant, unchallengeable.
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${teamPreviews}
        </div>
        <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:10px;
          padding:10px 14px;font-size:0.82rem;font-weight:600;color:#92400e;margin-bottom:18px">
          🎯 The wheel spins once and assigns a random play-order to <em>every</em> team at the same moment — fair for 2, 3, 4 or more teams.
        </div>
        <button class="btn btn-accent" style="width:100%;font-size:1rem;padding:16px" data-action="draw-spin">
          🎰 Spin the Wheel!
        </button>
      </div>`;
  }

  // ── Phase: spinning ───────────────────────────────────────────
  if(drawPhase === "spinning"){
    const slots = teams.map((t,i) => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
        background:var(--bg);border:2px solid var(--border2);border-radius:12px;
        animation:slotSpin 0.4s ease ${i*0.12}s both">
        <div style="width:32px;height:32px;border-radius:10px;background:${t.color};
          border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
          color:#fff;font-weight:800;font-size:0.75rem;flex-shrink:0">
          ${t.name.slice(0,2).toUpperCase()}
        </div>
        <div style="flex:1;font-weight:700;font-size:0.9rem">${escHtml(t.name)}</div>
        <div style="width:28px;height:28px;border-radius:50%;
          border:3px solid var(--border2);border-top-color:var(--accent);
          animation:drawSpin 0.5s linear infinite"></div>
      </div>`).join("");

    return `
      <div class="card" style="text-align:center;padding:36px 24px">
        <div style="font-size:2.5rem;margin-bottom:10px;animation:bounce 0.6s ease infinite">🎰</div>
        <div style="font-family:'Clash Display',sans-serif;font-size:1.4rem;font-weight:700;
          margin-bottom:6px">Drawing…</div>
        <div style="color:var(--muted);font-size:0.85rem;margin-bottom:24px">
          Randomly assigning play order to all teams
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;text-align:left">
          ${slots}
        </div>
      </div>`;
  }

  // ── Phase: result ─────────────────────────────────────────────
  if(drawPhase === "result"){
    // drawOrder is sorted: index 0 = first to play
    const orderedTeams = drawOrder.map(d => teams.find(t => t.id === d.id));
    const winner = orderedTeams[0];

    const MEDALS = ["🥇","🥈","🥉"];
    const ORDINALS = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];
    const ORDER_LABELS = ["Goes FIRST","Goes 2nd","Goes 3rd","Goes 4th",
                          "Goes 5th","Goes 6th","Goes 7th","Goes 8th","Goes 9th","Goes 10th"];
    const CONFETTI_COLORS = ["#f7c200","#e8400c","#22c55e","#3b82f6","#a855f7"];

    const orderRows = orderedTeams.map((t,i) => {
      const isFirst = i === 0;
      const medal = MEDALS[i] || `#${i+1}`;
      return `
        <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;
          background:${isFirst ? t.color+"18" : "var(--bg)"};
          border:${isFirst ? `2px solid ${t.color}` : "1.5px solid var(--border)"};
          border-radius:14px;
          box-shadow:${isFirst ? `0 4px 0 ${t.color}` : "none"};
          animation:cardIn 0.35s cubic-bezier(0.34,1.4,0.64,1) ${i*0.1+0.1}s both">
          <div style="font-size:1.5rem;width:36px;text-align:center;flex-shrink:0">${medal}</div>
          <div style="width:38px;height:38px;border-radius:11px;background:${t.color};
            border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
            color:#fff;font-weight:800;font-size:0.8rem;flex-shrink:0">
            ${t.name.slice(0,2).toUpperCase()}
          </div>
          <div style="flex:1">
            <div style="font-weight:800;font-size:0.95rem;font-family:'Clash Display',sans-serif">
              ${escHtml(t.name)}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)">${t.members.length} member${t.members.length!==1?"s":""}</div>
          </div>
          <div style="text-align:right">
            <div style="font-family:'Clash Display',sans-serif;font-size:0.82rem;font-weight:800;
              padding:4px 12px;border-radius:20px;
              background:${isFirst ? t.color : "var(--surface)"};
              border:2px solid ${isFirst ? t.color : "var(--border2)"};
              color:${isFirst ? "#fff" : "var(--muted)"}">
              ${ORDER_LABELS[i]}
            </div>
          </div>
        </div>`;
    }).join("");

    // How-it-was-decided note
    const seedNote = `Draw seed: <code style="font-family:monospace;background:rgba(0,0,0,0.06);
      padding:1px 6px;border-radius:4px;font-size:0.78rem">${drawOrder.map(d=>d.roll.toFixed(4)).join(" › ")}</code>`;

    return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <button class="btn btn-ghost btn-sm" data-action="draw-redo">🔄 Redraw</button>
        <div style="font-family:'Clash Display',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);
          font-weight:700;letter-spacing:-1px">Play Order Decided! 🎉</div>
      </div>

      <!-- Winner banner -->
      <div style="padding:22px 20px;border:3px solid ${winner.color};border-radius:20px;
        background:${winner.color}12;text-align:center;margin-bottom:16px;
        box-shadow:0 4px 0 ${winner.color};
        animation:resultPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both">
        <div style="font-size:2.5rem;margin-bottom:6px">🎰</div>
        <div style="font-size:0.72rem;font-weight:800;text-transform:uppercase;
          letter-spacing:2px;color:${winner.color};margin-bottom:4px">Draw Complete</div>
        <div style="font-family:'Clash Display',sans-serif;font-size:clamp(1.4rem,4vw,2rem);
          font-weight:700;letter-spacing:-0.5px;margin-bottom:4px">
          ${escHtml(winner.name)} goes first!
        </div>
        <div style="font-size:0.82rem;color:var(--ink2);font-weight:500">
          Full play order drawn below — determined by a single random roll
        </div>
      </div>

      <!-- Ordered list -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        ${orderRows}
      </div>

      <!-- Transparency note -->
      <div style="padding:10px 14px;border-radius:12px;background:rgba(0,0,0,0.04);
        border:1.5px solid var(--border);font-size:0.78rem;color:var(--muted);
        margin-bottom:20px;line-height:1.6">
        🔍 <strong>How the draw worked:</strong> Each team received a random number between 0–1.
        Highest number plays first. ${seedNote}
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn btn-ghost" data-action="draw-redo">🔄 Redraw</button>
        <button class="btn btn-yellow" data-action="export-draw">📋 Copy Order</button>
        <button class="btn btn-accent" data-action="start-over">🏠 Start Over</button>
      </div>`;
  }

  return `<div>Loading…</div>`;
}


// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════
function attachEvents(){
  // Input enter key
  const inp = document.getElementById("member-input");
  if(inp){
    inp.focus();
    inp.addEventListener("keydown", e=>{
      if(e.key==="Enter") handleAdd();
    });
    inp.addEventListener("input", e=>{
      state.memberInput = e.target.value;
    });
  }

  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation();
      handleAction(e.currentTarget);
    });
  });
}

function handleAction(el){
  const a = el.dataset.action;

  if(a==="add-member"){
    handleAdd();
  }
  else if(a==="remove-member"){
    const name = el.dataset.name;
    // Also unassign from teams
    const teams = state.teams.map(t=>({...t, members:t.members.filter(m=>m!==name)}));
    setState({ members:state.members.filter(m=>m!==name), teams, memberInput:"" });
  }
  else if(a==="clear-all"){
    if(state.members.length===0) return;
    setState({ members:[], teams:state.teams.map(t=>({...t,members:[]})), memberInput:"" });
    toast("All members cleared");
  }
  else if(a==="set-teams"){
    setState({ numTeams: parseInt(el.dataset.n) });
  }
  else if(a==="go-assign"){
    if(!state.numTeams || state.members.length < state.numTeams) return;
    // Build teams preserving existing ones if count unchanged
    let teams = [];
    for(let i=0; i<state.numTeams; i++){
      teams.push(
        state.teams[i]
          ? {...state.teams[i]}
          : { id:genId(), name:TEAM_NAMES[i]||`Team ${i+1}`, color:TEAM_COLORS[i%TEAM_COLORS.length], members:[] }
      );
    }
    // Trim extra teams
    teams = teams.slice(0, state.numTeams);
    // Remove members from teams that are no longer in member list
    teams = teams.map(t=>({...t, members:t.members.filter(m=>state.members.includes(m))}));
    setState({ step:2, teams, selectedChip:null });
  }
  else if(a==="back-to-step1"){
    setState({ step:1, selectedChip:null });
  }
  else if(a==="back-to-step2"){
    setState({ step:2, selectedChip:null });
  }
  else if(a==="select-chip"){
    const name = el.dataset.name;
    setState({ selectedChip: state.selectedChip===name ? null : name });
  }
  else if(a==="assign-to"){
    if(!state.selectedChip) return;
    const teamId = el.dataset.team;
    const teams = state.teams.map(t=>{
      if(t.id===teamId){
        if(!t.members.includes(state.selectedChip)){
          return {...t, members:[...t.members, state.selectedChip]};
        }
      }
      return t;
    });
    setState({ teams, selectedChip:null });
  }
  else if(a==="unassign"){
    const member = el.dataset.member;
    const teamId = el.dataset.team;
    const teams = state.teams.map(t=>{
      if(t.id===teamId) return {...t, members:t.members.filter(m=>m!==member)};
      return t;
    });
    setState({ teams });
  }
  else if(a==="auto-assign"){
    autoAssign();
  }
  else if(a==="reset-assign"){
    const teams = state.teams.map(t=>({...t, members:[]}));
    setState({ teams, selectedChip:null });
    toast("Assignments reset");
  }
  else if(a==="go-summary"){
    const unassigned = state.members.filter(m=>!state.teams.some(t=>t.members.includes(m)));
    if(unassigned.length>0) return;
    setState({ step:3 });
  }
  else if(a==="export-text"){
    exportText();
  }
  else if(a==="start-over"){
    setState({ step:1, numTeams:null, members:[], memberInput:"", teams:[], selectedChip:null,
               drawPhase:"ready", drawWinner:null, drawOrder:[], drawAnim:false });
  }
  // ── Draw actions ──
  else if(a==="go-toss"){
    setState({ step:4, drawPhase:"ready", drawWinner:null, drawOrder:[], drawAnim:false });
  }
  else if(a==="back-to-step3"){
    setState({ step:3 });
  }
  else if(a==="draw-spin"){
    setState({ drawPhase:"spinning" });
    // Animate for 1.8s then compute result
    setTimeout(()=>{
      // Each team gets a random roll 0–1; sort descending → rank
      const rolls = state.teams.map(t => ({ id:t.id, roll: Math.random() }));
      rolls.sort((a,b) => b.roll - a.roll);         // highest roll = first
      const drawOrder = rolls.map((r,i) => ({ id:r.id, rank:i+1, roll:r.roll }));
      setState({
        drawPhase: "result",
        drawWinner: drawOrder[0].id,
        drawOrder,
      });
    }, 1800);
  }
  else if(a==="draw-redo"){
    setState({ drawPhase:"ready", drawWinner:null, drawOrder:[], drawAnim:false });
  }
  else if(a==="export-draw"){
    const ORDINALS = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];
    const lines = [
      "🎰 PLAY ORDER DRAW RESULT",
      "══════════════════════════",
      ...state.drawOrder.map((d,i) => {
        const t = state.teams.find(tm=>tm.id===d.id);
        return `${ORDINALS[i]} — ${t.name} (roll: ${d.roll.toFixed(4)})`;
      }),
      "",
      "Draw is final and tamper-proof.",
    ];
    const text = lines.join("\n");
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>toast("📋 Draw result copied!"));
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════════════════════════
function handleAdd(){
  const inp = document.getElementById("member-input");
  const raw = (inp ? inp.value : state.memberInput).trim();
  if(!raw) return;

  const key = normalize(raw);
  // Check duplicate (case-insensitive)
  if(state.members.some(m=>normalize(m)===key)){
    toast(`"${raw}" is already in the list!`);
    inp.classList.add("error");
    setTimeout(()=>inp&&inp.classList.remove("error"), 1200);
    return;
  }

  setState({ members:[...state.members, raw], memberInput:"" });
}

function autoAssign(){
  // Collect unassigned members
  const assigned = new Set(state.teams.flatMap(t=>t.members));
  const unassigned = state.members.filter(m=>!assigned.has(m));
  if(!unassigned.length) return;

  // Shuffle unassigned
  const shuffled = [...unassigned].sort(()=>Math.random()-0.5);

  // Distribute round-robin to the team with fewest members first
  const teams = state.teams.map(t=>({...t, members:[...t.members]}));
  shuffled.forEach(member=>{
    // Find team with fewest members
    let minTeam = teams[0];
    teams.forEach(t=>{ if(t.members.length < minTeam.members.length) minTeam = t; });
    minTeam.members.push(member);
  });

  setState({ teams, selectedChip:null });
  toast(`⚡ Auto-assigned ${shuffled.length} member${shuffled.length!==1?"s":""}`);
}

function exportText(){
  const lines = ["🏆 TEAM ROSTER\n"];
  state.teams.forEach(t=>{
    lines.push(`${t.name} (${t.members.length} members)`);
    t.members.forEach((m,i)=>lines.push(`  ${i+1}. ${m}`));
    lines.push("");
  });
  const text = lines.join("\n");
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast("📋 Copied to clipboard!"));
  } else {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    toast("📋 Copied to clipboard!");
  }
}

function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ═══════════════════════════════════════════════════════════════
render();
</script>
